ce" font-size="12.5" fill="#59636e" text-anchor="end">3</text><text x="48" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#8c959f" font-style="italic">  return panjang * lebar;</text><text x="34" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#59636e" text-anchor="end">4</text><text x="48" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#8c959f" font-style="italic">}</text><circle cx="330" cy="96" r="12" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="330" y="100.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><rect x="44" y="130" width="250" height="54" rx="8" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4"/><circle cx="318" cy="157" r="12" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="318" y="161.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><line x1="0" y1="200" x2="800" y2="200" stroke="#d0d7de"/><text x="20" y="228" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e" text-anchor="start">Saran abu-abu dari Copilot: tekan Tab untuk menerima, atau terus mengetik untuk mengabaikannya.</text></svg>
