xt x="210" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#59636e" text-anchor="end">4</text><text x="220" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2328" text-anchor="start"></text><text x="210" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#59636e" text-anchor="end">5</text><text x="220" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2328" text-anchor="start">function kali(a, b) {</text><text x="210" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#59636e" text-anchor="end">6</text><text x="220" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2328" text-anchor="start">  return a * b;</text><text x="210" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#59636e" text-anchor="end">7</text><text x="220" y="200" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2328" text-anchor="start">}</text><circle cx="560" cy="110" r="12" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="560" y="114.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><line x1="191" y1="232" x2="799" y2="232" stroke="#d0d7de"/><text x="206" y="254" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="600">TERMINAL</text><rect x="200" y="264" width="588" height="110" rx="6" fill="#1f2328" stroke="#1f2328"/><text x="212" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3" text-anchor="start">$ npm test</text><text x="212" y="305" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3" text-anchor="start">(2 tes lulus)</text><text x="212" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3" text-anchor="start">$ git add .</text><text x="212" y="343" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3" text-anchor="start">$ git commit -m &quot;Tambah fungsi kali&quot;</text><text x="212" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3" text-anchor="start">$ git push -u origin fitur-kali</text><circle cx="770" cy="254" r="12" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="770" y="258.5" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">3</text></svg>
