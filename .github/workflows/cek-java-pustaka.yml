name: Cek Java 12-18 di browser (sementara)
on:
  push:
    branches: ['alat/cek-java-pustaka']
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEV_BYPASS: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on http://localhost:4173/ || sleep 5
      - run: node scripts/cek-java-pustaka.mjs
        env:
          FOLDER: module-13-unit-test,module-14-logging
