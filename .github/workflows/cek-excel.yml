name: Cek kelas Excel (sementara)

on:
  push:
    branches: ['alat/cek-excel']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Jalankan situs (mode dev, login dilewati)
        run: npx vite --port 5173 --strictPort &
        env:
          VITE_DEV_BYPASS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx -y wait-on http://localhost:5173/ && sleep 5
      - name: Audit
        run: node scripts/cek-excel.mjs
        env:
          FOTO: 'excel-dasar-07#4@390,excel-format-07#4@390,excel-teks-07#4@390,excel-tes-kerja-07#4@390,excel-data-08#4@1280'
