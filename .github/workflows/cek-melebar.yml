name: Cek melebar (sementara)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Jalankan situs (mode dev, login dilewati)
        run: npx vite --port 5173 --strictPort &
        env:
          VITE_DEV_BYPASS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx -y wait-on http://localhost:5173/ && sleep 5
      - name: Audit
        run: node scripts/cek-melebar.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: melebar
          path: melebar.png
