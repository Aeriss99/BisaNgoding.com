name: Rekam keluaran Java 12-18 (sementara)
on:
  push:
    branches: ['alat/java-rekam']
permissions:
  contents: read
jobs:
  rekam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rahasia
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prahasia"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: TZ=Asia/Jakarta bash alat/rekam/rekam.sh
