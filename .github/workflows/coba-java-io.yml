name: Coba Java IO di browser (sementara)
on:
  push:
    branches: ['alat/coba-java-io']
permissions:
  contents: read
jobs:
  coba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on http://localhost:4173/ || sleep 5
      - run: node scripts/coba-java-io.mjs
