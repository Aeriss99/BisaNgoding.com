name: Cek kelas Python (sementara)

on:
  push:
    branches: ['alat/cek-python']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Jalankan situs (mode dev, login dilewati)
        run: npx vite --port 5173 --strictPort &
        env:
          VITE_DEV_BYPASS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx -y wait-on http://localhost:5173/ && sleep 5
      - name: Audit
        run: node scripts/cek-python.mjs
        env:
          FOTO: 'python-dasar-01#4@390,python-kondisi-02#4@390,python-oop-03#4@1280,python-proyek-05#2@390,python-koleksi-05#2@390,/kelas/python@390,/@390'
