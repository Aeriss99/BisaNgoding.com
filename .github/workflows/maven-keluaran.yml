name: Rekam keluaran Maven (sementara)
on:
  push:
    branches: ['alat/maven-keluaran']
permissions:
  contents: read
jobs:
  rekam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash alat/maven.sh
