name: Cek Java baru di browser (sementara)
on:
  push:
    branches: ['alat/cek-java-baru']
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEV_BYPASS: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on http://localhost:4173/ || sleep 5
      - run: npx vite --port 5173 --strictPort &
        env:
          VITE_DEV_BYPASS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx -y wait-on http://localhost:5173/ && sleep 5
      - run: node scripts/cek-java-baru.mjs
