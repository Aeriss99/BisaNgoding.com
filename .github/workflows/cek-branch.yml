name: Cek branch
on:
  push:
    branches: [cek-bersih]
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:content
      - run: npm run test:java
      - run: npm run build
