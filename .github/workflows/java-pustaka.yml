name: Coba library Java di browser (sementara)
on:
  push:
    branches: ['alat/java-pustaka']
permissions:
  contents: read
jobs:
  coba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: bash alat/pustaka/jalan.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lib
          path: alat/pustaka/www/lib
