name: Coba library Java di browser (sementara)
on:
  push:
    branches: ['alat/java-pustaka']
permissions:
  contents: write
jobs:
  coba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && (npx playwright install --with-deps chromium || npx playwright install chromium)
      - name: Unduh jar dan simpan ke cabang alat/java-lib-jar2
        run: |
          cd alat/pustaka
          mvn -B -q -f pom2.xml dependency:copy-dependencies -DoutputDirectory=/tmp/lib2
          cd /tmp/lib2 && ls -la
          git init -q -b alat/java-lib-jar2 && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "jar library Java 8 (modul 19-26)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" alat/java-lib-jar2
      - run: bash alat/pustaka/jalan.sh
