name: Coba library Java di browser (sementara)
on:
  push:
    branches: ['alat/java-pustaka']
permissions:
  contents: write
jobs:
  coba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: bash alat/pustaka/jalan.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lib
          path: alat/pustaka/www/lib
      - name: Simpan jar ke cabang alat/java-lib-jar
        if: false
        continue-on-error: true
        run: |
          cd alat/pustaka/www/lib
          git init -q -b alat/java-lib-jar && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "jar library Java 8"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" alat/java-lib-jar
