name: Coba Java 21 di browser (sementara)

on:
  push:
    branches: ['feat/coba-java21']

permissions:
  contents: read

jobs:
  coba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Jalankan situs
        run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on http://localhost:4173/ || sleep 5
      - name: Coba Java 8 dan Java 21
        run: node scripts/coba-java21.mjs
