name: Coba Java 21 di browser (sementara)

on:
  push:
    branches: ['alat/coba-java21-hp']

permissions:
  contents: read

jobs:
  coba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Jalankan situs
        run: npx vite preview --port 4173 --strictPort &
      - run: npx wait-on http://localhost:4173/ || sleep 5
      - name: Android (Chromium, Pixel 7)
        run: node scripts/coba-java21.mjs
        env:
          MESIN: chromium
          PERANGKAT: Pixel 7
      - name: iPhone (WebKit/Safari, iPhone 15)
        if: always()
        run: node scripts/coba-java21.mjs
        env:
          MESIN: webkit
          PERANGKAT: iPhone 15
