name: Saran atau temuan
description: Bukan error, tapi ada yang membingungkan, kurang jelas, atau bisa lebih baik
title: "[Saran] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kelas
    attributes:
      label: Kelas
      options:
        - Java
        - JavaScript
        - English for IT
        - Git & GitHub
        - MySQL
        - RESTful API
        - Spring Boot
        - Node.js
        - Linux & Terminal
        - DevOps
        - HTML & CSS
        - Tailwind CSS
        - TypeScript
        - React
        - Microsoft Excel
        - Python
        - PHP
        - Bukan di kelas (beranda, profil, login, sertifikat, dll.)
    validations:
      required: true
  - type: input
    id: lokasi
    attributes:
      label: Lokasi
      placeholder: "Python Dasar, materi 5, kartu teori ketiga"
    validations:
      required: true
  - type: textarea
    id: temuan
    attributes:
      label: Apa yang kurang?
      placeholder: "Penjelasan for terlalu cepat, contoh kodenya langsung susah"
    validations:
      required: true
  - type: textarea
    id: usul
    attributes:
      label: Usulan
      description: Kalau ada ide perbaikannya.
  - type: textarea
    id: gambar
    attributes:
      label: Tangkapan layar
