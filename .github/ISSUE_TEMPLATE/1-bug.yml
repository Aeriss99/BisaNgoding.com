name: Laporan bug
description: Ada yang salah, error, atau tampilannya berantakan
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Satu bug, satu laporan. Isi sesingkat mungkin, yang penting bisa diulang.
  - type: dropdown
    id: kelas
    attributes:
      label: Kelas
      options:
        - Java
        - JavaScript
        - English for IT
        - Git & GitHub
        - MySQL
        - RESTful API
        - Spring Boot
        - Node.js
        - Linux & Terminal
        - DevOps
        - HTML & CSS
        - Tailwind CSS
        - TypeScript
        - React
        - Microsoft Excel
        - Python
        - PHP
        - Bukan di kelas (beranda, profil, login, sertifikat, dll.)
    validations:
      required: true
  - type: input
    id: lokasi
    attributes:
      label: Lokasi
      description: Nama modul dan materi, atau salin alamat halamannya.
      placeholder: "Java Dasar, materi 12, kartu praktik langkah 3"
    validations:
      required: true
  - type: dropdown
    id: perangkat
    attributes:
      label: Perangkat
      options:
        - HP (Chrome)
        - HP (browser lain)
        - Laptop (Chrome)
        - Laptop (browser lain)
        - Aplikasi terpasang (PWA)
    validations:
      required: true
  - type: dropdown
    id: tingkat
    attributes:
      label: Seberapa parah?
      options:
        - Parah (tidak bisa lanjut belajar, halaman error, progres hilang)
        - Sedang (salah tapi masih bisa lanjut)
        - Kecil (salah ketik, tampilan kurang rapi)
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah sampai muncul bug
      placeholder: |
        1. Buka materi ...
        2. Klik ...
        3. Ketik kode ...
    validations:
      required: true
  - type: textarea
    id: terjadi
    attributes:
      label: Yang terjadi
      description: Salin pesan error kalau ada.
    validations:
      required: true
  - type: textarea
    id: seharusnya
    attributes:
      label: Yang seharusnya
  - type: textarea
    id: gambar
    attributes:
      label: Tangkapan layar
      description: Tarik gambar ke sini atau tempel (Ctrl+V).
