<!DOCTYPE html>
<html>
<body>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script>
async function run() {
  await cheerpjInit({version: 17});
  console.log('init done');
  try {
    const enc = new TextEncoder();
    cheerpOSAddStringFile('/str/Main.java', enc.encode('public class Main { public static void main(String[] args) { System.out.println("Hello"); } }'));
    const res = await cheerpjRunMain('org.eclipse.jdt.internal.compiler.batch.Main', '/app/public/ecj.jar', '-17', '-nowarn', '-proceedOnError', '-d', '/files/', '/str/Main.java');
    console.log('Result:', res);
  } catch (e) {
    console.error('Error:', e);
  }
}
run();
</script>
</body>
</html>
